<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · DocDoki</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,__ICON__">
<style>__CSS__</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Doc<span>♥</span>Doki</div>
    <strong id="project-name"></strong>
    <label class="search"><span class="sr-only" data-en="Search documents" data-zh="搜索文档">Search documents</span><input id="search" type="search" autocomplete="off"></label>
    <button id="changes-toggle" aria-controls="changes" aria-expanded="false"><span data-en="Changes" data-zh="改动">Changes</span><b id="count" hidden></b></button>
    <button id="language" class="sticker" data-en-label="Switch to Chinese" data-zh-label="切换到英文">中</button>
  </header>
  <aside class="library" id="library" data-en-label="Navigation" data-zh-label="导航">
    <div class="library-heading"><strong data-en="Navigation" data-zh="导航">Navigation</strong><button id="library-close" data-en-label="Close navigation" data-zh-label="关闭导航">×</button></div>
    <nav class="primary-nav">
      <button data-nav="dashboard" data-en="Dashboard" data-zh="看板">Dashboard</button>
      <button data-nav="overview" data-en="Overview" data-zh="总览">Overview</button>
      <button data-nav="northstar" data-en="Northstar" data-zh="北极星">Northstar</button>
      <button data-nav="work" data-en="Current work" data-zh="当前工作">Current work</button>
    </nav>
    <div id="catalog"></div>
  </aside>
  <main class="workspace" id="workspace" tabindex="-1">
    <div class="source-bar">
      <button id="library-toggle" class="nav-toggle" aria-controls="library" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 3V21" stroke="currentColor" stroke-width="1.5"/><path class="sidebar-fill" d="M4 4H8V20H4Z"/></svg></button>
      <div class="document-location">
        <div id="document-path" class="document-path"></div>
        <span id="path-copy-status" class="sr-only" role="status"></span>
        <button id="source-view" class="source-toggle" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6L2 12L7 18M17 6L22 12L17 18M14 4L10 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></button>
      </div>
    </div>
    <div id="preview-status" class="preview-status" role="status" hidden></div>
    <details id="diagnostics" class="diagnostics" hidden><summary data-en="Document issues" data-zh="文档问题">Document issues</summary><ul id="diagnostic-list"></ul></details>
    <div class="reader" id="reader" hidden>
      <article class="markdown" id="reading"></article><div id="related"></div>
    </div>
    <section class="editor" id="editor" hidden>
      <label for="source" class="sr-only" data-en="Document source" data-zh="文档源码">Document source</label>
      <textarea id="source" spellcheck="false" wrap="off"></textarea>
    </section>
    <section id="graph" class="graph" data-en-label="Progress and dependencies" data-zh-label="进展与依赖">
      <p id="graph-empty" class="empty" hidden data-en="No specs yet." data-zh="还没有规格。">No specs yet.</p>
      <div id="viewport" class="viewport"><svg id="edges" class="edges"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,4 L0,8 Z" fill="#000"></path></marker><marker id="arrow-selected" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,4 L0,8 Z" fill="#e91d2a"></path></marker><marker id="arrow-dim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,4 L0,8 Z" fill="#cfcfcf"></path></marker></defs><g id="edge-lines"></g></svg><div id="graph-cards"></div></div>
      <div id="connect-hint" class="connect-hint" role="status" hidden></div>
      <div class="graph-tools"><button id="zoom-out" data-en-label="Zoom out" data-zh-label="缩小">−</button><button id="zoom-label" aria-pressed="false">100%</button><button id="zoom-in" data-en-label="Zoom in" data-zh-label="放大">+</button><button id="fit" class="tool-group" data-en-label="Fit diagram (0)" data-zh-label="适配视图（0）"><span aria-hidden="true">▣</span></button><button id="reset-layout" data-en-label="Restore automatic layout (R)" data-zh-label="恢复自动布局（R）"><span aria-hidden="true">⟲</span></button><button id="connect" class="tool-group" aria-pressed="false" data-en-label="Connect dependencies (C)" data-zh-label="连接依赖（C）"><span aria-hidden="true">⇄</span></button></div>
      <svg id="minimap" class="minimap" role="img" data-en-label="Dependency map; click or drag to pan" data-zh-label="依赖缩略图；点击或拖动平移"><g id="mini-nodes"></g><rect id="mini-view" fill="none" stroke="#e91d2a" stroke-width="2" vector-effect="non-scaling-stroke"></rect></svg>
      <div class="edge-detail" id="edge-detail" hidden></div>
    </section>
  </main>
  <aside class="changes" id="changes" data-en-label="Changes" data-zh-label="改动">
    <h2><span data-en="Changes" data-zh="改动">Changes</span><button id="changes-close" data-en-label="Close changes" data-zh-label="关闭改动">×</button></h2>
    <div class="change-list" id="change-list"></div>
    <div id="save-error" class="save-error" role="status" hidden></div>
    <div class="save-controls" id="save-controls" hidden>
      <div class="save-actions"><button id="save" class="primary" data-en="Save" data-zh="保存">Save</button><button id="copy-agent" data-en="Copy to Agent" data-zh="复制给 Agent">Copy to Agent</button></div>
      <button id="export" hidden data-en="Download recovery copy" data-zh="下载恢复副本">Download recovery copy</button>
      <p id="private-warning" class="private-warning" hidden></p>
      <label id="prompt-label" hidden for="prompt" data-en="Copy this request manually" data-zh="请手动复制这份请求">Copy this request manually</label>
      <textarea id="prompt" hidden readonly spellcheck="false"></textarea>
    </div>
  </aside>
  <footer id="status" class="status" role="status" aria-live="polite"></footer>
</div>
<script nonce="__NONCE__">__VENDOR__</script>
<script nonce="__NONCE__">__STATE__</script>
<script nonce="__NONCE__">const INITIAL_GRAPH=__DATA__; const SAVE_TOKEN=__TOKEN__;
__APP__</script>
</body>
</html>
