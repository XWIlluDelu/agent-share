source_repos:
  anthropic:
    url: "https://github.com/anthropics/skills.git"
  openai:
    url: "https://github.com/openai/skills.git"
  k_dense:
    url: "https://github.com/K-Dense-AI/claude-scientific-skills.git"
  scicraft:
    url: "https://github.com/jaechang-hits/scicraft.git"
  obsidian:
    url: "https://github.com/kepano/obsidian-skills.git"
  research_skills:
    url: "https://github.com/ceasonen/research-skills.git"
  tapestry:
    url: "https://github.com/michalparkola/tapestry-skills.git"
  mattpocock_skills:
    url: "https://github.com/mattpocock/skills.git"
  semantic_scholar_skills:
    url: "https://github.com/zongmin-yu/semantic-scholar-skills.git"
  humanizer:
    url: "https://github.com/blader/humanizer.git"
  paper_lifecycle:
    url: "https://github.com/M1n-n9/paper-lifecycle.git"
  factory_plugins:
    url: "https://github.com/Factory-AI/factory-plugins.git"
  academic_forge:
    url: "https://github.com/HughYau/AcademicForge.git"
  ui_ux_pro_max:
    url: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git"
  custom:
    type: custom
    path: "."

skills:
  # Anthropic official
  - name: anthropic-skill-creator
    pack: agent-dev
    source_repo: anthropic
    source_path: "skills/skill-creator"
    notes: "Local normalization: skill name changed to anthropic-skill-creator to avoid collision; validator uses stdlib frontmatter parsing instead of pyyaml; upstream vendor-specific wording retained as reference material."
  - name: pdf
    pack: documents
    source_repo: anthropic
    source_path: "skills/pdf"
  - name: docx
    pack: documents
    source_repo: anthropic
    source_path: "skills/docx"
    notes: "Claude author wording in tracked changes is accepted; ignore for portability audit."
  - name: pptx
    pack: documents
    source_repo: anthropic
    source_path: "skills/pptx"
    notes: "Claude author default in Office scripts is accepted; ignore for portability audit."
  - name: xlsx
    pack: documents
    source_repo: anthropic
    source_path: "skills/xlsx"
    notes: "Claude author default in Office scripts is accepted; ignore for portability audit."
  - name: frontend-design
    pack: frontend
    source_repo: anthropic
    source_path: "skills/frontend-design"
  - name: ui-ux-pro-max
    pack: frontend
    source_repo: ui_ux_pro_max
    source_path: ".claude/skills/ui-ux-pro-max"
    notes: "Local normalization: replace stale inventory counts with durable capability wording, resolve bundled search commands from the skill directory, treat the live CLI help as authoritative, make the search formatter execution-neutral, and normalize imported text line endings and trailing whitespace. Only ui-ux-pro-max is selected from this repository."
  - name: webapp-testing
    pack: web-testing
    source_repo: anthropic
    source_path: "skills/webapp-testing"
  # OpenAI official / curated
  - name: openai-skill-creator
    pack: agent-dev
    source_repo: openai
    source_path: "skills/.system/skill-creator"
    notes: "Local normalization: skill name changed to openai-skill-creator to avoid collision; scripts use stdlib frontmatter parsing instead of pyyaml; agents/openai.yaml is generated only when explicitly requested; upstream vendor-specific wording retained as reference material."
  - name: cli-creator
    pack: agent-dev
    source_repo: openai
    source_path: "skills/.curated/cli-creator"
    notes: "Local normalization: agent-neutral wording; shared install discouraged unless explicitly needed."
  - name: jupyter-notebook
    pack: scientific-tools
    source_repo: openai
    source_path: "skills/.curated/jupyter-notebook"
    notes: "Local normalization: replace CODEX_HOME-specific skill path with project-local skill installation guidance."
  - name: playwright
    pack: web-testing
    source_repo: openai
    source_path: "skills/.curated/playwright"
    notes: "Local normalization: replace CODEX_HOME/PWCLI-specific skill paths with project-local skill installation guidance."

  # K-Dense / claude-scientific-skills
  - name: scientific-brainstorming
    pack: scientific-thinking
    source_repo: k_dense
    source_path: "skills/scientific-brainstorming"
    notes: "Local normalization: remove upstream author metadata."
  - name: hypothesis-generation
    pack: scientific-thinking
    source_repo: k_dense
    source_path: "skills/hypothesis-generation"
    notes: "Local normalization: remove upstream author/platform metadata and provider-specific schematic generation guidance/scripts."
  - name: scientific-critical-thinking
    pack: scientific-thinking
    source_repo: k_dense
    source_path: "skills/scientific-critical-thinking"
    notes: "Local normalization: remove upstream author metadata and provider-specific schematic generation guidance."
  - name: citation-management
    pack: paper-writing
    source_repo: k_dense
    source_path: "skills/citation-management"
    notes: "Local normalization: remove upstream author/platform metadata and provider-specific schematic generation guidance/scripts; keep only NCBI environment hints."
  - name: peer-review
    pack: paper-writing
    source_repo: k_dense
    source_path: "skills/peer-review"
    notes: "Local normalization: remove upstream author/platform metadata and provider-specific schematic generation guidance/scripts."
  - name: exploratory-data-analysis
    pack: scientific-tools
    source_repo: k_dense
    source_path: "skills/exploratory-data-analysis"
    notes: "Local normalization: remove upstream author metadata."
  - name: statistical-analysis
    pack: scientific-tools
    source_repo: k_dense
    source_path: "skills/statistical-analysis"
    notes: "Local normalization: remove upstream author metadata."

  # AcademicForge / Claude Science
  - name: literature-review
    pack: paper-discovery
    source_repo: academic_forge
    source_path: "skills/claude-science/literature-review"
    notes: "Local normalization: portable setup instructions, vendor-neutral wording, and no upstream .catalog_stamp file."
  - name: pdf-explore
    pack: documents
    source_repo: academic_forge
    source_path: "skills/claude-science/pdf-explore"
    notes: "Scope: PDF reading, navigation, and extraction. Local normalization: portable setup instructions, vendor-neutral wording, and no upstream .catalog_stamp file."
  - name: figure-style
    pack: scientific-tools
    source_repo: academic_forge
    source_path: "skills/claude-science/figure-style"
    notes: "Local normalization: portable setup instructions, vendor-neutral wording, and no upstream .catalog_stamp file."
  - name: figure-composer
    pack: scientific-tools
    source_repo: academic_forge
    source_path: "skills/claude-science/figure-composer"
    notes: "Local normalization: portable setup instructions, vendor-neutral wording, and no upstream .catalog_stamp file."
  - name: paper-narrative
    pack: paper-writing
    source_repo: academic_forge
    source_path: "skills/claude-science/paper-narrative"
    notes: "Scope: figure-deck story and paper arc. Local normalization: portable setup instructions, vendor-neutral wording, and no upstream .catalog_stamp file."

  # scicraft
  - name: openalex-database
    pack: paper-discovery
    source_repo: scicraft
    source_path: "skills/scientific-writing/openalex-database"
  - name: sympy-symbolic-math
    pack: scientific-tools
    source_repo: scicraft
    source_path: "skills/scientific-computing/sympy-symbolic-math"

  # kepano / obsidian-skills (defuddle only)
  - name: defuddle
    pack: documents
    source_repo: obsidian
    source_path: "skills/defuddle"

  # Other public sources
  - name: research-paper-writing
    pack: paper-writing
    source_repo: research_skills
    source_path: "skills/research-paper-writing"
  - name: review-revision
    pack: paper-writing
    source_repo: paper_lifecycle
    source_path: "review-revision"
    notes: "Local normalization narrows the skill to manuscript review/revision and routes formal rebuttal drafting to rebuttal-response."
  - name: rebuttal-response
    pack: paper-writing
    source_repo: paper_lifecycle
    source_path: "rebuttal-response"
    notes: "Local normalization clarifies that actual reviews, AC comments, and rebuttal rules should use this skill rather than review-revision."
  - name: youtube-transcript
    pack: media-ingest
    source_repo: tapestry
    source_path: "youtube-transcript"
  - name: grilling
    pack: always-on
    source_repo: mattpocock_skills
    source_path: "skills/productivity/grilling"
  # Factory engineering skills
  - name: simplify
    pack: always-on
    source_repo: factory_plugins
    source_path: "plugins/core/skills/simplify"
    notes: "No LICENSE in factory-plugins; lib/simplify is gitignored and local-only. Fresh clones must sync from sources/factory_plugins before audit."

  # Custom/local skills
  - name: code-review
    pack: software-dev
    source_repo: custom
    source_path: "lib/code-review"
    notes: "Custom explicit-use whole-repository or scoped review skill. Independently synthesized from shadcn/improve reconnaissance and evidence vetting, specialone0007/repo-organization-audit structural checks, addyosmani/code-review-and-quality review lenses, and mattpocock/codebase-design module-depth principles; no upstream text is mirrored."
  - name: skill-manager
    pack: local-maintenance
    source_repo: custom
    source_path: "lib/skill-manager"
    notes: "Custom registry/audit skill for maintaining .agent-share."
  - name: skill-creator
    pack: always-on
    source_repo: custom
    source_path: "lib/skill-creator"
    notes: "Custom orchestrator over anthropic-skill-creator and openai-skill-creator; vendor-neutral wrapper with in-folder relative symlinks to the source creator skills."
  - name: better-read-html
    pack: documents
    source_repo: custom
    source_path: "lib/better-read-html"
    notes: "Custom portable skill for source-first, static, auditable HTML document artifacts; scholarly/paper rigor lives in its reference material. Pack: documents, not always-on."

  - name: docdoki
    pack: always-on
    source_repo: custom
    source_path: "lib/docdoki"
    notes: "Custom living-documentation skill for docdoki/ libraries. The agent executes semantic protocols with Read/Edit/Bash; a bundled deterministic checker enforces the gitignored private-document boundary, and the optional panel presents both visibility scopes."

  - name: project-setup
    pack: always-on
    source_repo: custom
    source_path: "lib/project-setup"
    notes: "Custom project setup skill for shared skill links and generated AGENTS.md files from agents-fragments."

  - name: humanizer
    pack: documents
    source_repo: humanizer
    source_path: "."
    notes: "Pack: documents, not always-on. Local normalization: move the upstream top-level version field into standard metadata. The skill is otherwise harness-neutral; repo-level packaging (.claude-plugin/, AGENTS.md, README.md) is retained as upstream content."

  - name: chaos
    pack: always-on
    source_repo: custom
    source_path: "lib/chaos"
    notes: "Custom always-on deliberation skill; keep lightweight and generic."

  - name: remote-compute
    pack: compute
    source_repo: custom
    source_path: "lib/remote-compute"
    notes: "Custom vendor-neutral SSH compute skill; scheduler/GPU/service/sudo are conditional patterns."


  # Semantic Scholar discovery layer
  - name: paper-triage
    pack: paper-discovery
    source_repo: semantic_scholar_skills
    source_path: "skills/paper-triage"
  - name: expand-references
    pack: paper-discovery
    source_repo: semantic_scholar_skills
    source_path: "skills/expand-references"
  - name: trace-citations
    pack: paper-discovery
    source_repo: semantic_scholar_skills
    source_path: "skills/trace-citations"
