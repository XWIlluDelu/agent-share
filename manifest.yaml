# source_commit pins each maintained skill's accepted upstream baseline.
# notes describes its intentional local delta; sources/ HEAD is only a cache.
source_repos:
  anthropic:
    url: "https://github.com/anthropics/skills.git"
  openai:
    url: "https://github.com/openai/skills.git"
  openai_codex:
    url: "https://github.com/openai/codex.git"
  k_dense:
    url: "https://github.com/K-Dense-AI/claude-scientific-skills.git"
  scicraft:
    url: "https://github.com/jaechang-hits/scicraft.git"
  research_skills:
    url: "https://github.com/ceasonen/research-skills.git"
  semantic_scholar_skills:
    url: "https://github.com/zongmin-yu/semantic-scholar-skills.git"
  humanizer:
    url: "https://github.com/blader/humanizer.git"
  paper_lifecycle:
    url: "https://github.com/M1n-n9/paper-lifecycle.git"
  academic_forge:
    url: "https://github.com/HughYau/AcademicForge.git"
  ui_ux_pro_max:
    url: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git"
  custom:
    type: custom
    path: "."

skills:
  # Anthropic official
  - name: anthropic-skill-creator
    pack: agent-dev
    source_repo: anthropic
    source_path: "skills/skill-creator"
    source_commit: "41bbe19d1a1a7eaab5e7bb9050a417e5c6cffc8f"
    notes: "Local normalization: skill name changed to anthropic-skill-creator to avoid collision; validator uses stdlib frontmatter parsing instead of pyyaml; upstream vendor-specific wording retained as reference material."
  - name: pdf
    pack: documents
    source_repo: anthropic
    source_path: "skills/pdf"
    source_commit: "e4bb5d960d87126ff3b3a8af1a104b7db67560ba"
  - name: docx
    pack: documents
    source_repo: anthropic
    source_path: "skills/docx"
    source_commit: "e4bb5d960d87126ff3b3a8af1a104b7db67560ba"
    notes: "Retain the upstream Claude comment-author default. Local normalization strips imported Python trailing whitespace."
  - name: pptx
    pack: documents
    source_repo: anthropic
    source_path: "skills/pptx"
    source_commit: "e4bb5d960d87126ff3b3a8af1a104b7db67560ba"
    notes: "Local normalization strips imported Python trailing whitespace."
  - name: xlsx
    pack: documents
    source_repo: anthropic
    source_path: "skills/xlsx"
    source_commit: "e4bb5d960d87126ff3b3a8af1a104b7db67560ba"
    notes: "Local normalization strips imported Python trailing whitespace."
  - name: frontend-design
    pack: frontend
    source_repo: anthropic
    source_path: "skills/frontend-design"
    source_commit: "41bbe19d1a1a7eaab5e7bb9050a417e5c6cffc8f"
  - name: ui-ux-pro-max
    pack: frontend
    source_repo: ui_ux_pro_max
    source_path: ".claude/skills/ui-ux-pro-max"
    source_commit: "2de1134dc4d1cfe112934611ae5803ae17a1bd7e"
    notes: "Replace fixed inventory counts with capability wording. Resolve bundled commands from the skill directory and use live CLI help for flags. Keep search output execution-neutral and use a verified RTL search example. Normalize imported text line endings and trailing whitespace. Omit tests that only work in the source repository and skip the token compiler comparison when the sibling compiler is absent. Include the upstream repository-root MIT license."
  # OpenAI official / curated
  - name: openai-skill-creator
    pack: agent-dev
    source_repo: openai_codex
    source_path: "codex-rs/skills/src/assets/samples/skill-creator"
    source_commit: "bb5b9c6240136de8ff4d30215e2341c44559aa04"
    notes: "Use openai-skill-creator as the local name and retain the Codex-specific guide as reference material. Scaffold host-neutral templates and generate agents/openai.yaml only with an explicit --interface option. Keep the CLI scripts stdlib-only and preserve support for the compatibility frontmatter field."
  - name: cli-creator
    pack: agent-dev
    source_repo: openai
    source_path: "skills/.curated/cli-creator"
    source_commit: "49f948faa9258a0c61caceaf225e179651397431"
    notes: "Local normalization: agent-neutral wording in the skill, UI metadata, and CLI reference; default companion skills to project .agents/skills, with project-setup handling platform bridges; global install only when requested."
  - name: jupyter-notebook
    pack: scientific-tools
    source_repo: openai
    source_path: "skills/.curated/jupyter-notebook"
    source_commit: "49f948faa9258a0c61caceaf225e179651397431"
    notes: "Local normalization: replace CODEX_HOME-specific paths in SKILL.md and notebook references with the absolute canonical skill directory, following installation symlinks rather than assuming a discovery root. scripts/new_notebook.py defaults output to the caller's project (or cwd outside Git), not the shared skill repository."
  - name: playwright
    pack: web-testing
    source_repo: openai
    source_path: "skills/.curated/playwright"
    source_commit: "49f948faa9258a0c61caceaf225e179651397431"
    notes: "Local normalization: resolve PWCLI from the absolute canonical skill directory in SKILL.md and the CLI reference, following installation symlinks instead of CODEX_HOME or the caller's working directory."

